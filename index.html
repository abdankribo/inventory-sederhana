<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Sederhana</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><p class="eyebrow">STOCK MANAGEMENT</p><h1>Inventory</h1></div><button id="add">+ Tambah Barang</button></header><section class="stats"><div><span>Total barang</span><b id="total">0</b></div><div><span>Stok menipis</span><b id="low">0</b></div><div><span>Nilai inventory</span><b id="value">Rp0</b></div></section><input id="search" class="search" placeholder="Cari barang..."><div id="list" class="list"></div></main><dialog id="dialog"><form method="dialog" id="form"><h2>Tambah Barang</h2><input id="name" placeholder="Nama barang" required><input id="stock" type="number" min="0" placeholder="Stok" required><input id="price" type="number" min="0" placeholder="Harga" required><select id="category"><option>Elektronik</option><option>Alat Tulis</option><option>Umum</option></select><div class="dialog-actions"><button value="cancel">Batal</button><button id="save" value="default">Simpan</button></div></form></dialog><script src="script.js"></script></body></html>
